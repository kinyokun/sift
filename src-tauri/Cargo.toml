[package]
name = "sift"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Fast photo culling for JPEG and RAW"

[lib]
name = "sift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
sift-core = { path = "../crates/sift-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "rt", "rt-multi-thread", "fs", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.10"
percent-encoding = "2"
futures-util = { version = "0.3", default-features = false }
image = { version = "0.25", default-features = false }
