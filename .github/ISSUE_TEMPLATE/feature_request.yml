name: 功能建议 / Feature request
description: 希望 Sift 能做的事
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题 / The problem
      description: 选片时遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 设想 / Your idea
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的变通办法 / Workarounds today
