name: live-win-check

on:
  push:
    branches: [live-win-check]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  live:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sift-core --locked --no-default-features --features heif,develop --lib live -- --nocapture
        env:
          SIFT_LIVE_OUT: ${{ runner.temp }}\live-photos
          RUST_BACKTRACE: 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-photos
          path: ${{ runner.temp }}\live-photos
          if-no-files-found: warn
          retention-days: 3
