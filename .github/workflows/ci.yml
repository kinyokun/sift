name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS app
        type: boolean
        default: false

# A newer push to the same branch or pull request replaces the running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p sift-core -p sift-delta --locked
      - run: cargo clippy -p sift-core -p sift-delta --all-targets --locked

  # The parts only Windows has: its H.264 encoder writing a Live Photo, the
  # bundled HEIF decoder on the platform that has no other, and updates
  # replacing a program that is running.
  core-windows:
    name: core tests (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p sift-core --locked
        env:
          SIFT_LIVE_OUT: ${{ runner.temp }}\live-photos
      - run: cargo test -p sift-delta --locked
      # The Live Photos the test made, to be checked with Photos on a Mac.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-photos-windows-${{ github.sha }}
          path: ${{ runner.temp }}\live-photos
          if-no-files-found: warn
          retention-days: 7

  web:
    name: type check and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # Runs alongside the tests rather than after them, so the installer is ready sooner.
  windows:
    name: windows installer
    uses: ./.github/workflows/build.yml
    with:
      platform: windows
      quick: true
      artifact: sift-windows-${{ github.sha }}
    secrets: inherit

  macos:
    name: macos app
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    uses: ./.github/workflows/build.yml
    with:
      platform: macos
      quick: true
      artifact: sift-macos-${{ github.sha }}
    secrets: inherit
