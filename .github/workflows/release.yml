# Push a tag such as v0.2.0 (see CONTRIBUTING.md): this builds the macOS and
# Windows installers with the full release profile and opens a draft release.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/version.mjs --check "$GITHUB_REF_NAME"

  licenses:
    name: third-party licences
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: cargo fetch --locked
      - run: cargo about generate --locked about.hbs -o THIRD-PARTY-LICENSES.html
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: THIRD-PARTY-LICENSES.html
          if-no-files-found: error

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos]
    uses: ./.github/workflows/build.yml
    with:
      platform: ${{ matrix.platform }}
      quick: false
      artifact: release-${{ matrix.platform }}
    secrets: inherit

  publish:
    name: draft release
    needs: [build, licenses]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HAS_UPDATER: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      # Artifacts keep their folders (release/bundle/nsis/…); release files go flat.
      # The macOS update package is built as Sift.app.tar.gz and gets the same
      # kind of name as the installers.
      - name: Collect files
        run: |
          mkdir dist
          find out -type f -exec mv -t dist {} +
          for f in dist/Sift.app.tar.gz*; do
            if [ -e "$f" ]; then mv "$f" "dist/Sift_${GITHUB_REF_NAME#v}_universal${f#dist/Sift}"; fi
          done
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat notes.md
      # Deltas from the releases just before this one, signed, and updates.json,
      # which lists them and those earlier releases published (see
      # scripts/deltas.mjs). Pre-releases are not offered as updates.
      - name: Deltas
        if: env.HAS_UPDATER == 'true' && !contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          command -v 7z || sudo apt-get install -y p7zip-full
          pnpm install --frozen-lockfile
          cargo build --release --locked -p sift-delta
          node scripts/deltas.mjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" target/release/sift-delta
      # latest.json is what installed copies read to learn of this version; it
      # carries the signatures (updates.json those of the deltas), so the .sig
      # files are not published.
      - name: Update manifest
        run: |
          node scripts/latest-json.mjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" notes.md
          rm -f dist/*.sig
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --draft $prerelease \
            --title "Sift ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md
