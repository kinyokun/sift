[package]
name = "sift-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Photo culling core: container parsing, embedded previews, AF points, ratings"

[features]
default = ["face", "develop", "heif"]
face = ["dep:tract-onnx"]
develop = ["dep:rawler"]
# The bundled HEIF decoder. Apple platforms decode HEIF with the system and
# only fall back on it.
heif = ["dep:heic-decoder"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
jpeg-decoder = "0.3"
filetime = "0.2"
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
tract-onnx = { version = "=0.23.10", optional = true }
rawler = { version = "0.8", optional = true }
heic-decoder = { version = "=0.1.1", optional = true }

[build-dependencies]
cc = "1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

# The HEVC encoder for the HEIC still of a Live Photo (`live/heic.rs`). Apple
# platforms write theirs with the system and only test with it; phones make
# no Live Photos.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
still265 = "=0.6.1"

# The system's trash (`remove.rs`). Phones have none, and on Linux, where
# nothing is shipped, photos are only ever deleted for good.
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
trash = { version = "=5.4.0", default-features = false, features = ["coinit_apartmentthreaded"] }

# Media Foundation, the system's H.264 encoder (`live/mf.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_LibraryLoader"] }
