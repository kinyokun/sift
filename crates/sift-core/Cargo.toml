[package]
name = "sift-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Photo culling core: container parsing, embedded previews, AF points, ratings"

[features]
default = ["face", "develop"]
face = ["dep:tract-onnx"]
develop = ["dep:rawler"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff", "gif"] }
jpeg-decoder = "0.3"
filetime = "0.2"
ab_glyph = { version = "0.2", features = ["variable-fonts"] }
tract-onnx = { version = "=0.23.10", optional = true }
rawler = { version = "0.8", optional = true }

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
